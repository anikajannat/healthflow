<section class="section"><div class="container"><div class="page-head"><div><p class="eyebrow">Account</p><h2>{{auth.user()?.name}}</h2><p class="muted">{{auth.user()?.email}} · {{auth.user()?.role}}</p></div></div>
@if(auth.role()==='Patient'){<div class="form-shell" style="margin:0;max-width:760px;width:100%"><h3>Patient profile</h3><div class="grid grid-2"><div class="field"><label>Phone</label><input [(ngModel)]="p.phone"></div><div class="field"><label>Date of birth</label><input type="date" [(ngModel)]="p.dateOfBirth"></div><div class="field"><label>Gender</label><input [(ngModel)]="p.gender"></div><div class="field"><label>Blood group</label><input [(ngModel)]="p.bloodGroup"></div></div><div class="field"><label>Address</label><input [(ngModel)]="p.address"></div><div class="field"><label>Allergies</label><textarea [(ngModel)]="p.allergies"></textarea></div><div class="field"><label>Current medications</label><textarea [(ngModel)]="p.currentMedications"></textarea></div><div class="field"><label>Emergency contact</label><input [(ngModel)]="p.emergencyContact"></div>@if(message){<p class="success">{{message}}</p>}@if(error){<p class="error">{{error}}</p>}<button class="btn btn-primary" (click)="save()">Save profile</button></div>}
</div></section>
